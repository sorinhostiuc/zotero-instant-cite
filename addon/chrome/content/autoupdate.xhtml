<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <title>AutoUpdate Library</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      background: #fff;
      color: #333;
      padding: 20px;
    }
    h2 { font-size: 18px; margin-bottom: 12px; color: #1a1a1a; }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-box {
      padding: 12px;
      border-radius: 8px;
      background: #f5f5f5;
      text-align: center;
    }
    .stat-box .num {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.2;
    }
    .stat-box .label { font-size: 12px; color: #666; margin-top: 2px; }
    .stat-box.filled .num { color: #2a7d4f; }
    .stat-box.corrected .num { color: #e67e22; }
    .stat-box.nomatch .num { color: #999; }
    .stat-box.errors .num { color: #c0392b; }
    .progress-section { margin-bottom: 14px; }
    .progress-bar-bg {
      width: 100%;
      height: 24px;
      border-radius: 12px;
      background: #e9ecef;
      overflow: hidden;
      position: relative;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #2a7d4f, #27ae60);
      border-radius: 12px;
      width: 0%;
    }
    .progress-text {
      text-align: center;
      margin-top: 6px;
      font-size: 13px;
      color: #555;
    }
    .current-item {
      background: #fef9e7;
      border: 1px solid #f9e79f;
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 14px;
      font-size: 13px;
      word-break: break-word;
    }
    .current-item .src {
      display: inline-block;
      background: #27ae60;
      color: #fff;
      padding: 1px 7px;
      border-radius: 3px;
      font-size: 11px;
      margin-left: 6px;
    }
    .log-area {
      background: #1e1e1e;
      color: #d4d4d4;
      border-radius: 6px;
      padding: 10px;
      height: 180px;
      overflow-y: auto;
      font-family: "Cascadia Code", "Fira Code", monospace;
      font-size: 12px;
      line-height: 1.5;
      margin-bottom: 14px;
      white-space: pre-wrap;
    }
    .log-fill { color: #4ec9b0; }
    .log-correct { color: #e6a23c; }
    .log-warn { color: #f48771; }
    .btn-row { display: flex; gap: 10px; justify-content: flex-end; }
    button {
      padding: 10px 22px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-cancel { background: #e74c3c; color: #fff; }
    .btn-cancel:hover { background: #c0392b; }
    .btn-close { background: #eee; color: #333; border: 1px solid #ccc; }
    .btn-close:hover { background: #ddd; }
  </style>
</head>
<body>
  <h2>AutoUpdate Library</h2>
  <div class="stats">
    <div class="stat-box filled">
      <div class="num" id="filled-count">0</div>
      <div class="label">Fields Filled</div>
    </div>
    <div class="stat-box corrected">
      <div class="num" id="corrected-count">0</div>
      <div class="label">Fields Corrected</div>
    </div>
    <div class="stat-box nomatch">
      <div class="num" id="nomatch-count">0</div>
      <div class="label">No Match</div>
    </div>
    <div class="stat-box errors">
      <div class="num" id="errors-count">0</div>
      <div class="label">Errors</div>
    </div>
  </div>
  <div class="progress-section">
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-bar"/>
    </div>
    <div class="progress-text" id="progress-text">Starting...</div>
  </div>
  <div class="current-item" id="current-item">Initializing scan...</div>
  <div class="log-area" id="log-area"></div>
  <div class="btn-row">
    <button class="btn-cancel" id="btn-cancel">Cancel (Esc)</button>
  </div>
</body>
</html>
